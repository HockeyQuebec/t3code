on_success = "standard_plan"
on_failure = "critical_research"

# The routine route is deliberately unsectioned: a task classified as routine is
# one that does not split into a behavior section and a verification section, so
# mid-run supervision would buy a second certification of the same small diff.
# The rest of the rule still holds — the cheap tier types, a stronger model
