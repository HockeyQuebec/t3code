# The automatic Claude route: one cheap Haiku classification decides how much
# team the task earns, so nobody has to pick a workflow by hand.
#
#   ROUTINE  -> Haiku writes one bounded change, Sonnet certifies and repairs it
#   STANDARD -> Sonnet writes the work order, a Haiku crew implements it section
#               by section under a Sonnet section lead, Sonnet certifies
#   CRITICAL -> the same shape one tier up: Opus writes the work order and
#               certifies the result
#
# A malformed classification escalates to CRITICAL rather than silently buying a
# cheaper route.
[workflows.auto_claude]
description = "Classifier routes to a routine, standard, or team branch. Claude only. Cheap on the routine path, deep on the team one."
entrypoint = "classify"
workspace = "worktree"
base_ref = "HEAD"
max_steps = 34
max_wall_seconds = 16200
max_cost_usd = 25.0

[workflows.auto_claude.nodes.classify]
kind = "agent"
agent = "planner"
on_success = "routine_gate"
on_failure = "failed"
prompt = """
Classify this T3 Code task so the team can be sized to it. Inspect only enough of
the repository to judge its real blast radius; do not edit and do not solve it.
<task>{{task}}</task>

ROUTINE is bounded, well-specified work: docs or comments, mechanical tests or
configuration, localized boilerplate, a small change inside an existing pattern,
or a narrow bug with a known reproduction and no boundary risk. It is work that
does not split into a behavior section and a verification section, and that
touches one surface rather than several.

CRITICAL means failure could cross a trust or durability boundary: auth,
permissions, secrets, destructive behavior, data loss, the event-sourced store or
a schema migration, checkpointing, concurrency, the websocket/relay/tunnel
transport, provider adapter protocol changes, `packages/contracts` changes that
every client follows, public compatibility, a large behavioral refactor, or a
hard nondeterministic production bug. It also covers work whose shape is
genuinely unclear, because that is what an architect is for.

Everything else is STANDARD: ordinary features, contained bug fixes, frontend
work, and bounded behavioral refactors.

Return one short reason, then exactly one final line:
ROUTE: ROUTINE
or
ROUTE: STANDARD
or
ROUTE: CRITICAL
"""

[workflows.auto_claude.nodes.routine_gate]
kind = "gate"
checks = [{ type = "output_matches", pattern = "(?m)^ROUTE: ROUTINE\\s*$" }]
on_success = "routine_implement"
on_failure = "standard_gate"

[workflows.auto_claude.nodes.standard_gate]
kind = "gate"
# STANDARD is the only positive match, so an unparseable classification lands
# on the critical route with its architect and frontier reviewer.
checks = [{ type = "output_matches", pattern = "(?m)^ROUTE: STANDARD\\s*$" }]
on_success = "std_plan"
on_failure = "team_plan"

# The routine route is deliberately unsectioned: a task classified as routine is
# one that does not split into a behavior section and a verification section, so
# mid-run supervision would buy a second certification of the same small diff.
# The rest of the rule still holds — the cheap tier types, a stronger model
# certifies, and that model makes the repair rather than handing the worker a
# retry loop.
[workflows.auto_claude.nodes.routine_implement]
kind = "agent"
agent = "haiku_worker"
on_success = "routine_changed"
on_failure = "failed"
prompt = """
Implement this bounded T3 Code task end to end:
<task>{{task}}</task>
Stay inside the established repository patterns, add focused tests when
behavior changes, and validate the result with `vp test run <files>` for the
tests you touched. A stronger model certifies this and repairs it itself if
it fails, so keep the change small and coherent rather than ambitious.

Do not commit, push, publish, deploy, message anyone, or contact external
systems. Never start a server against `~/.t3/userdata` — that is the developer's
live database and it is in use while you work. Never kill a process you did not
spawn yourself, and never kill by pattern. Never set VITE_HTTP_URL or
VITE_WS_URL.
"""

[workflows.auto_claude.nodes.routine_changed]
kind = "gate"
checks = [{ type = "diff_not_empty" }]
on_success = "routine_verify"
on_failure = "failed"

[workflows.auto_claude.nodes.routine_verify]
kind = "command"
command = [
  "sh",
  "-c",
  'export PATH="$PWD/node_modules/.bin:$PATH"; vp fmt --check && vp lint --report-unused-disable-directives && vp run -r --concurrency-limit 2 typecheck && vp run -r test',
]
timeout_seconds = 3600
max_visits = 4
on_success = "routine_review"
on_failure = "routine_repair"

[workflows.auto_claude.nodes.routine_review]
kind = "judge"
agent = "reviewer"
max_visits = 3
on_success = "done"
on_failure = "routine_repair"
prompt = """
Certify the tested diff for this bounded task:
<task>{{task}}</task>
Fail only for concrete correctness, contract, surface-coverage, state,
recovery, or security defects. Optional polish is a pass.

The deterministic gate already passed here: `vp fmt --check`, `vp lint`,
`vp run -r typecheck` across every workspace, and `vp run -r test`. Do not report a defect
of a kind those would have caught — formatting, lint rules, type errors, or a
