# Recommended adaptive route when all three providers are available. One cheap
# Luna classification chooses one of three routes, and all three obey the same
# rule: the most capable model in the route decides and never types, the cheapest
# model that can do the editing does it, and a rejected pass is repaired by the
# lead rather than retried by the worker.
#
#   ROUTINE  -> Luna writes one bounded change, Terra certifies and repairs it
#   STANDARD -> Terra writes the work order, Composer implements it section by
#               section under a Terra lead who repairs, Sol certifies
#   CRITICAL -> Luna + Haiku scout, Sol writes the work order, Composer implements
#               each section under a Sonnet lead, Sol then Opus certify
#
# Fast Cursor variants are deliberately absent: they change throughput rather than
# intelligence and consume the same included pool far faster.
[workflows.model_council]
description = "Widest loop in the file: a classifier routes across three provider branches. Deepest and most expensive; reach for it deliberately."
entrypoint = "classify"
workspace = "worktree"
base_ref = "HEAD"
max_steps = 34
max_wall_seconds = 16200
max_cost_usd = 30.0

[workflows.model_council.nodes.classify]
kind = "agent"
agent = "codex_planner"
on_success = "routine_gate"
on_failure = "failed"
prompt = """
Classify this T3 Code task so the team can be sized to it. Inspect only enough of
the repository to judge its real blast radius; do not edit and do not solve it.
<task>{{task}}</task>

ROUTINE is bounded, well-specified work: docs or comments, mechanical tests or
configuration, localized boilerplate, a small change inside an existing pattern,
or a narrow bug with a known reproduction and no boundary risk. It is work that
does not split into a behavior section and a verification section, and that
touches one surface rather than several.

CRITICAL means failure could cross a trust or durability boundary: auth,
permissions, secrets, destructive behavior, data loss, the event-sourced store or
a schema migration, checkpointing, concurrency, the websocket/relay/tunnel
transport, provider adapter protocol changes, `packages/contracts` changes that
every client follows, public compatibility, a large behavioral refactor, or a
hard nondeterministic production bug. It also covers work whose shape is
genuinely unclear, because that is what an architect is for.

Everything else is STANDARD: ordinary features, contained bug fixes, frontend
work, and bounded behavioral refactors.

Return one short reason, then exactly one final line:
ROUTE: ROUTINE
or
ROUTE: STANDARD
or
ROUTE: CRITICAL
"""

[workflows.model_council.nodes.routine_gate]
kind = "gate"
checks = [{ type = "output_matches", pattern = "(?m)^ROUTE: ROUTINE\\s*$" }]
on_success = "routine_implement"
on_failure = "standard_gate"

