# --- quick_fix: the economy tier --------------------------------------------
# One small writer, then the same deterministic verification every other
# workflow in this file runs. No planner, no supervisor, no model review, and
# no repair round — if the change does not pass on the first attempt, the run
# fails and hands you the worktree rather than spending more to rescue it.
#
# This is the loop to reach for by default. `model_council` is roughly thirty
# times its worst case; use that one when the task actually needs a council.
[workflows.quick_fix]
description = "One small writer certified by deterministic verification. No model review, no repair."
entrypoint = "implement"
workspace = "worktree"
base_ref = "HEAD"
max_steps = 3
max_wall_seconds = 5400
max_cost_usd = 2.0

[workflows.quick_fix.nodes.implement]
kind = "agent"
agent = "quick_writer"
on_success = "changed"
on_failure = "failed"
prompt = """
Outcome: complete the following task in this repository.

<task>
{{task}}
</task>

Read the repository's durable instructions first. Make the smallest coherent
change that fully satisfies the task, and match the conventions of the code you
are editing. Do not commit, push, publish, or contact external systems.

Formatting, lint, typecheck, and the test suite all run after you stop, and
nothing reviews your work afterwards — the change either passes them or the run
fails. Finish with a compact description of what you changed and any assumption
you had to make.
"""

[workflows.quick_fix.nodes.changed]
kind = "gate"
checks = [{ type = "diff_not_empty" }]
on_success = "verify"
on_failure = "failed"

[workflows.quick_fix.nodes.verify]
kind = "command"
command = [
  "sh",
  "-c",
  'export PATH="$PWD/node_modules/.bin:$PATH"; vp fmt --check && vp lint --report-unused-disable-directives && vp run -r --concurrency-limit 2 typecheck && vp run -r test',
]
timeout_seconds = 3600
on_success = "done"
on_failure = "failed"
